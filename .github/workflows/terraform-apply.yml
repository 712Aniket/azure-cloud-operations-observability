name: Terraform Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-project2
  cancel-in-progress: false

jobs:
  apply:
    name: Approved Terraform Deployment
    runs-on: ubuntu-latest
    environment: terraform-apply

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Azure Login using deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Initialize
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Generate Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan > plan-output.txt

      - name: Apply Saved Terraform Plan
        run: terraform apply -input=false -no-color tfplan

      - name: Remove Temporary Terraform Files
        if: always()
        run: rm -f tfplan plan-output.txt
